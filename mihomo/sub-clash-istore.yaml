# 锚点
mr: &mr {type: select, proxies: [🇭🇰 香港节点, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🇩🇪 德国节点, 🪜 全部]}
pr: &pr {type: select, proxies: [🎯 直连, 默认, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇩🇪 德国节点, 🔯 备用1, 🅱️ 备用2, 🪜 全部]}

# 全局配置
mixed-port: 7890
authentication:
- "user:passwd"
skip-auth-prefixes:
- 127.0.0.0/8
- 192.168.0.0/16
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9091
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

ntp:
  enable: true
  write-to-system: true

tun:
  enable: true
  stack: mixed   
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - cn_ip

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
  
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn_domain,private_domain,idirect,fakeipfilter_cn":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
    - https://8.8.8.8/dns-query#默认&disable-qtype-65=true
  nameserver:
    - https://8.8.8.8/dns-query#默认&ecs=223.5.5.0/24
  fallback:
    - https://8.8.8.8/dns-query#默认
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:idirect
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain

# 策略组
proxy-groups:
  - {name: 默认, <<: *mr}
  - {name: 📩 Fcm, <<: *pr}
  - {name: 🧬 iproxy, <<: *pr}
  - {name: ☘️ Gemini, <<: *pr}
  - {name: 📽 YouTube, <<: *pr}
  - {name: 📥 Google, <<: *pr}
  - {name: 👨🏿‍💻 GitHub, <<: *pr}
  - {name: 📲 Telegram, <<: *pr}
  - {name: 👨🏻‍🎓 AI, <<: *pr}
  - {name: 🎵 TikTok, <<: *pr}
  - {name: 🔑 Reddit, <<: *pr}
  - {name: 🎙 Meta, <<: *pr}
  - {name: 📚 Twitter, <<: *pr}   
  - {name: 💰 PayPal, <<: *pr}
  - {name: 💵 Bybit, <<: *pr}
  - {name: 💸 Binance, <<: *pr}
  - {name: 🌎 国外媒体, <<: *pr}
  - {name: 🪟 Microsoft, <<: *pr}
  - {name: 🐟 漏网之鱼, type: select, <<: *pr, include-all: true}
  - {name: 🎯 直连, type: select, proxies: [DIRECT]}
  - {name: 🇭🇰 香港节点, type: fallback, include-all: true, interval: 600, filter: "(?i)港|🇭🇰|hk|hongkong|hong kong"}
  - {name: 🇯🇵 日本节点, type: fallback, include-all: true, interval: 600, filter: "(?i)日|🇯🇵|jp|东京|大阪|沪日|japan"}
  - {name: 🇸🇬 新加坡节点, type: fallback, include-all: true, interval: 600, filter: "(?i)新|🇸🇬|SG|Singapore|新加坡|狮"}
  - {name: 🇹🇼 台湾节点, type: fallback, include-all: true, interval: 600, filter: "(?i)台|🇹🇼|TW|Taiwan"}
  - {name: 🇺🇲 美国节点, type: fallback, include-all: true, interval: 600, filter: "(?i)美|🇺🇲|🇺🇸|凤凰城|洛杉矶|圣何塞|西雅图|US|America|United States|USA"}
  - {name: 🇩🇪 德国节点, type: fallback, include-all: true, interval: 600, filter: "(?i)德国|法兰|DE|Germany|de|柏|法国|🇫🇷|英国|都柏林"}
  - {name: 🔯 备用1, type: select, include-all: true, filter: "(?i)港|🇭🇰|hk|hongkong|hong kong"}
  - {name: 🅱️ 备用2, type: select, include-all: true, filter: "(?i)台|🇹🇼|TW|Taiwan"}
  - {name: 🪜 全部, type: select, include-all: true}
  
rules: 
  # 拦截规则
  - IP-CIDR, 198.18.0.1/16, REJECT, no-resolve  # 防止 fake-ip 模式下网络回环
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT  # 阻止海外 QUIC
  # 自定义
  - RULE-SET,google_fcm,📩 Fcm
  - RULE-SET,idirect,🎯 直连
  - RULE-SET,google_cn,🎯 直连
  - RULE-SET,iproxy,🧬 iproxy
  - RULE-SET,Cloudflare,默认
  - RULE-SET,google_gemini,☘️ Gemini
  - RULE-SET,openai,👨🏻‍🎓 AI
  - RULE-SET,category-ai-chat,👨🏻‍🎓 AI
  - RULE-SET,category-ai,👨🏻‍🎓 AI
  - RULE-SET,youtube_domain,📽 YouTube
  - RULE-SET,google_play,📥 Google
  - RULE-SET,google_domain,📥 Google
  - RULE-SET,google_ip,📥 Google,no-resolve
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,gitbook,👨🏿‍💻 GitHub  
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,tiktok-ads,REJECT
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,twitter-ads,REJECT
  - RULE-SET,twitter_dom,📚 Twitter
  - RULE-SET,twitter_ip,📚 Twitter,no-resolve
  - RULE-SET,reddit_domain,🔑 Reddit
  - RULE-SET,paypal_domain,💰 PayPal
  - RULE-SET,bybit_domain,💵 Bybit
  - RULE-SET,binance_domain,💸 Binance
  - RULE-SET,microsoft_domain,🪟 Microsoft 
  - RULE-SET,meta_all,🎙 Meta
  - RULE-SET,facebook,🎙 Meta
  - RULE-SET,whatsapp,🎙 Meta
  - RULE-SET,instagram,🎙 Meta
  - RULE-SET,threads,🎙 Meta
  - RULE-SET,facebook_ip,🎙 Meta,no-resolve
  - RULE-SET,Globalmedia,🌎 国外媒体
  - RULE-SET,GFW,默认
  - RULE-SET,geolocation-!cn,默认
  - RULE-SET,private_domain,🎯 直连
  - RULE-SET,direct2,🎯 直连
  - RULE-SET,direct3,🎯 直连
  - RULE-SET,direct4,🎯 直连
  - RULE-SET,Chinacompany_ip,🎯 直连,no-resolve
  - RULE-SET,cn_domain,🎯 直连
  - RULE-SET,cn_ip,🎯 直连,no-resolve
  - MATCH,🐟 漏网之鱼
  
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
  class_yaml: &class_yaml {type: http, interval: 86400, behavior: classical, format: yaml}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  
